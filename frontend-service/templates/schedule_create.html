{% extends "base.html" %}
{% block title %}Add Schedule{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md w-96">
  <h2 class="text-2xl font-semibold mb-6 text-center">Add New Schedule</h2>

  <form method="POST" action="/schedules/create" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Class ID</label>
      <input
        type="text"
        name="class_id"
        placeholder="e.g. d55fd2ae-bcbf-4f41-9414-c676cb73cf5a"
        class="w-full px-4 py-2 border rounded text-xs"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Room ID</label>
      <input
        type="text"
        name="room_id"
        placeholder="e.g. 9ecaf219-7590-4673-98ff-f892480566e6"
        class="w-full px-4 py-2 border rounded text-xs"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Day of Week</label>
      <select
        name="day"
        class="w-full px-4 py-2 border rounded"
        required
      >
        <option value="">Select Day</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
        <option value="7">Sunday</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Start Time (HH:MM)</label>
      <input
        type="time"
        name="start_time"
        class="w-full px-4 py-2 border rounded"
        required
      />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">End Time (HH:MM)</label>
      <input
        type="time"
        name="end_time"
        class="w-full px-4 py-2 border rounded"
        required
      />
    </div>

    <button
      type="submit"
      class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700"
    >
      Add Schedule
    </button>

    <a
      href="/schedules"
      class="block text-center w-full bg-gray-600 text-white py-2 rounded hover:bg-gray-700"
    >
      Cancel
    </a>
  </form>

  {% if request.query_params.get('error') %}
  <p class="text-red-500 text-sm mt-3 text-center">Failed to add schedule. Try again.</p>
  {% endif %}
</div>
{% endblock %}
