{% extends "base.html" %}
{% block title %}Create Schedule{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
  <h2 class="text-2xl font-semibold mb-6">Create New Schedule</h2>

  {% if request.query_params.get('error') %}
  <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    Failed to create schedule. Please try again.
  </div>
  {% endif %}

  <form method="post" action="/schedules/create">
    <div class="mb-4">
      <label for="class_id" class="block text-gray-700 font-semibold mb-2">Class ID</label>
      <input
        type="number"
        id="class_id"
        name="class_id"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        placeholder="Enter class ID"
        required
      />
    </div>

    <div class="mb-4">
      <label for="room_id" class="block text-gray-700 font-semibold mb-2">Room ID</label>
      <input
        type="number"
        id="room_id"
        name="room_id"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        placeholder="Enter room ID"
        required
      />
    </div>

    <div class="mb-4">
      <label for="day_of_week" class="block text-gray-700 font-semibold mb-2">Day of Week</label>
      <select
        id="day_of_week"
        name="day_of_week"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        required
      >
        <option value="">Select Day</option>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
      </select>
    </div>

    <div class="mb-4">
      <label for="start_time" class="block text-gray-700 font-semibold mb-2">Start Time</label>
      <input
        type="time"
        id="start_time"
        name="start_time"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        required
      />
    </div>

    <div class="mb-6">
      <label for="end_time" class="block text-gray-700 font-semibold mb-2">End Time</label>
      <input
        type="time"
        id="end_time"
        name="end_time"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
        required
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white font-semibold px-4 py-2 rounded hover:bg-blue-700"
    >
      Create Schedule
    </button>

    <a href="/schedules" class="block mt-4 text-center text-gray-600 hover:text-gray-800">
      Back to Schedules
    </a>
  </form>
</div>
{% endblock %}
